<!DOCTYPE html>
<html lang = "en">
<meta charset="UTF-8">
<title>ADSR_Works</title>
</head>
<body>

    <button id = "button1">Play1st</button>
    <button id = "button2">Play2nd</button>
    <button id = "button3">Play3rd</button>
    <button id = "button4">Play4th</button>

    <script>
       
       const myCtx = new AudioContext();


        function playNote1(someContext, frequency, dur)
        {
            const osc1 = new OscillatorNode(someContext);
            const osc2 = new OscillatorNode(someContext);
            const gain = new GainNode(someContext);
        
            
            osc1.frequency.value = frequency;
            osc2.frequency.value = frequency*2.1;
            osc1.type = "triangle"
            osc2.type = "triangle"
            gain.gain.value = 0;

            osc1.connect(gain).connect(someContext.destination);
            osc2.connect(gain).connect(someContext.destination);

            let now = someContext.currentTime;

            gain.gain.exponentialRampToValueAtTime(0.30, now + (dur*0.01)); //attack
            gain.gain.exponentialRampToValueAtTime(0.001, now + (dur*0.5)) //decay
            gain.gain.exponentialRampToValueAtTime(0.30, now + (dur*0.9))
            gain.gain.exponentialRampToValueAtTime(0.001, now + dur); //release

            osc1.start();
            osc1.stop(now + dur);

            osc2.start();
            osc2.stop(now + dur);

        }
            let freq = 110
            let dur = 2
        
             document.querySelector("#button1").onclick = () => playNote1(myCtx, freq, dur);

        

        function playNote2(someContext, frequency, dur)
        {
            const osc1 = new OscillatorNode(someContext);
            const osc2 = new OscillatorNode(someContext);
            const gain = new GainNode(someContext);
        
            
            osc1.frequency.value = frequency;
            osc2.frequency.value = frequency*2.1;
            osc1.type = "triangle"
            osc2.type = "triangle"
            gain.gain.value = 0;

            osc1.connect(gain).connect(someContext.destination);
            osc2.connect(gain).connect(someContext.destination);

            let now = someContext.currentTime;

            gain.gain.linearRampToValueAtTime(0.30, now + (dur*0.01)); //attack
            gain.gain.linearRampToValueAtTime(0.00, now + (dur*0.5)) //decay
            gain.gain.linearRampToValueAtTime(0.30, now + (dur*0.9))
            gain.gain.linearRampToValueAtTime(0.00, now + dur); //release

            osc1.start();
            osc1.stop(now + dur);

            osc2.start();
            osc2.stop(now + dur);

        }

            let freq2 = 110
            let dur2 = 2

      
    document.querySelector("#button2").onclick = () => playNote2(myCtx, freq2, dur2);


    function playNote3(someContext, frequency, dur)
        {
            const osc1 = new OscillatorNode(someContext);
            const osc2 = new OscillatorNode(someContext);
            const gain = new GainNode(someContext);
        
            
            osc1.frequency.value = frequency;
            osc2.frequency.value = frequency*2.1;
            osc1.type = "triangle"
            osc2.type = "triangle"
            gain.gain.value = 0;

            osc1.connect(gain).connect(someContext.destination);
            osc2.connect(gain).connect(someContext.destination);

            let now = someContext.currentTime;

            gain.gain.linearRampToValueAtTime(0.30, now + (dur*0.01)); //attack
            gain.gain.linearRampToValueAtTime(0.10, now + (dur*0.08)) //decay
            gain.gain.linearRampToValueAtTime(0.30, now + (dur*0.3))
            gain.gain.linearRampToValueAtTime(0.00, now + (dur*0.6))
            gain.gain.linearRampToValueAtTime(0.30, now + (dur*0.99))
            gain.gain.linearRampToValueAtTime(0, now + dur); //release

            osc1.start();
            osc1.stop(now + dur);

            osc2.start();
            osc2.stop(now + dur);

        }

               let freq3 = 165
               let dur3 = 3
      
    document.querySelector("#button3").onclick = () => playNote3(myCtx, freq3, dur3);

     function playNote4(someContext, frequency, dur)
        {
            const osc1 = new OscillatorNode(someContext);
            const osc2 = new OscillatorNode(someContext);
            const gain = new GainNode(someContext);
        
            
            osc1.frequency.value = frequency;
            osc2.frequency.value = frequency*2.1;
            osc1.type = "triangle"
            osc2.type = "triangle"
            gain.gain.value = 0;

            osc1.connect(gain).connect(someContext.destination);
            osc2.connect(gain).connect(someContext.destination);

            let now = someContext.currentTime;

            gain.gain.linearRampToValueAtTime(0.40, now + (dur*0.01)); //attack
            gain.gain.linearRampToValueAtTime(0.05, now + (dur*0.1)) //decay
            gain.gain.linearRampToValueAtTime(0.30, now + (dur*0.99))
            gain.gain.linearRampToValueAtTime(0, now + dur); //release

            osc1.start();
            osc1.stop(now + dur);

            osc2.start();
            osc2.stop(now + dur);

        }

               let freq4 = 210
               let dur4 = 3

    document.querySelector("#button4").onclick = () => playNote4(myCtx, freq4, dur4);

    </script>
    
</body>

</html>
